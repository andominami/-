<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>セミナー資料ライブラリ</title>
  <meta name="description" content="社内向けセミナーの資料・動画を検索・閲覧できるライブラリです。" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="lock-screen" class="lock-screen">
    <form id="lock-form" class="lock-form">
      <img class="site-logo" src="assets/logo.png" alt="ロゴ" />
      <p>合言葉を入力してください</p>
      <input type="password" id="lock-password" placeholder="合言葉" autocomplete="off" />
      <p id="lock-error" class="lock-error" hidden>合言葉が違います。</p>
      <button type="submit">入る</button>
    </form>
  </div>

  <div id="site-content" hidden>
    <header class="site-header">
      <img class="site-logo" src="assets/logo.png" alt="ロゴ" />
      <h1>セミナー資料ライブラリ</h1>
      <a class="post-link" href="https://docs.google.com/forms/d/e/1FAIpQLSf8WwM9qvaeugEj3uJBFlwuUct3_5fZD2qxjAlsGd86QAgnsA/viewform" target="_blank" rel="noopener noreferrer">＋ 資料を投稿する</a>
    </header>

    <main>
      <div id="media-tabs" class="media-tabs" role="tablist" aria-label="資料・動画で絞り込み">
        <button type="button" class="media-tab active" data-media="all">すべて</button>
        <button type="button" class="media-tab" data-media="material">資料</button>
        <button type="button" class="media-tab" data-media="video">動画</button>
        <button type="button" class="media-tab" data-media="favorite">お気に入り</button>
      </div>

      <div class="controls">
        <input id="search-input" type="search" placeholder="タイトル・登壇者・タグなどで検索…" aria-label="検索" />
        <select id="sort-select" aria-label="並び替え">
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
          <option value="title">タイトル順</option>
        </select>
      </div>

      <div id="category-filters" class="category-filters" role="group" aria-label="カテゴリで絞り込み"></div>

      <p id="result-count" class="result-count"></p>
      <p id="empty-message" class="empty-message" hidden>該当する資料が見つかりませんでした。</p>
      <div id="card-grid" class="video-grid"></div>
    </main>

    <footer class="site-footer">
      <p>セミナー資料ライブラリ — 資料の投稿は「＋ 資料を投稿する」から</p>
    </footer>
  </div>

  <div id="detail-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content">
      <button type="button" id="modal-close" class="modal-close" data-close aria-label="閉じる">&times;</button>
      <button type="button" id="modal-favorite-btn" class="modal-favorite-btn" aria-label="お気に入りに追加">♡</button>
      <div id="modal-tabs" class="modal-tabs" hidden></div>
      <div id="modal-frame-wrap" class="modal-frame-wrap" hidden>
        <iframe id="modal-iframe" src="" allow="autoplay" allowfullscreen></iframe>
        <img id="modal-image" src="" alt="" hidden />
        <div id="modal-material-nav" class="modal-material-nav" hidden>
          <button type="button" id="modal-material-prev" class="modal-material-nav-btn modal-material-prev" aria-label="前の資料">&#10094;</button>
          <button type="button" id="modal-material-next" class="modal-material-nav-btn modal-material-next" aria-label="次の資料">&#10095;</button>
          <span id="modal-material-count" class="modal-material-count"></span>
        </div>
      </div>
      <div class="modal-text">
        <p id="modal-meta" class="modal-meta"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-description"></p>
      </div>
    </div>
  </div>

  <script src="assets/common.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
