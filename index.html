<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>セミナー資料ライブラリ</title>
  <meta name="description" content="社内・社外のセミナー資料と動画をまとめて検索・閲覧できるライブラリです。" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div>
        <h1>セミナー資料ライブラリ</h1>
        <p class="subtitle">これまで開催したセミナーの資料・動画をまとめて検索できます</p>
      </div>
      <a class="admin-link" href="admin.html">資料を登録・管理する</a>
    </header>

    <div class="controls">
      <div class="search-box">
        <input id="search-input" type="search" placeholder="タイトル・登壇者・タグなどで検索…" />
      </div>
      <select id="category-filter">
        <option value="">すべてのカテゴリ</option>
      </select>
      <select id="sort-order">
        <option value="date-desc">新しい順</option>
        <option value="date-asc">古い順</option>
        <option value="title-asc">タイトル順</option>
      </select>
    </div>

    <div id="tag-cloud" class="tag-cloud"></div>

    <div id="result-count" class="result-count"></div>
    <div id="card-grid" class="card-grid"></div>

    <footer class="site-footer">
      <p>Seminar Materials Library — GitHub Pages で公開しています</p>
    </footer>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="modal-close" aria-label="閉じる">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="assets/common.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
